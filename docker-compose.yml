version: '3.8'

services:
  poker-db:
    image: postgres:16-alpine
    container_name: poker_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: