services:
  poker-db:
    image: postgres:16-alpine
    container_name: poker_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-poker_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-super_secret_poker_password_2026}
      POSTGRES_DB: ${DB_NAME:-poker_club_db}
    ports:
      - "${DB_PORT:-5439}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poker_admin} -d ${DB_NAME:-poker_club_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - poker-network

  poker-api:
    build:
      context: .
      dockerfile: PokerClub.Api/Dockerfile
    container_name: poker_backend_api
    restart: always
    depends_on:
      poker-db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5052
      - VkOptions__AppId=${VK_APP_ID}
      - VkOptions__ClientSecret=${VK_PROTECTED_KEY}
      - VK_ADMIN_IDS=${VK_ADMIN_IDS:-}
      - ConnectionStrings__DefaultConnection=Host=poker-db;Port=5432;Database=${DB_NAME:-poker_club_db};Username=${DB_USER:-poker_admin};Password=${DB_PASSWORD:-super_secret_poker_password_2026}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID:-1zxU_LOSjIsjrEHw7eq366BQMLWQ4x8pSDIiMdUxWPOs}
      - GOOGLE_SHEETS_SEASON_GID=${GOOGLE_SHEETS_SEASON_GID:-202622}
      - GoogleSheets__SpreadsheetId=${GOOGLE_SHEETS_SPREADSHEET_ID:-1zxU_LOSjIsjrEHw7eq366BQMLWQ4x8pSDIiMdUxWPOs}
      - GoogleSheets__SeasonGid=${GOOGLE_SHEETS_SEASON_GID:-202622}
    ports:
      - "5052:5052"
    networks:
      - poker-network

  poker-client:
    build:
      context: ./poker-client
      dockerfile: Dockerfile
    container_name: poker_frontend_client
    restart: always
    depends_on:
      - poker-api
    ports:
      - "3000:80"
    networks:
      - poker-network

volumes:
  pgdata:

networks:
  poker-network:
    driver: bridge